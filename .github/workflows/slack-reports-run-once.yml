name: Slack report — run once
# Ad-hoc single-report fire for the "Run Now" button in /slack-reports, dispatched via the
# GitHub API (same pattern as triggerOwnerPull() in app/admin/actions.ts) so a slow DB/Slack
# round-trip never risks a Vercel serverless timeout.
on:
  workflow_dispatch:
    inputs:
      report_id:
        description: "sdr_slack_reports.id to run"
        required: true
permissions:
  contents: read
jobs:
  run-once:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run slack-reports:run-once
        env:
          REPORT_ID: ${{ github.event.inputs.report_id }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SLACK_VAIBHAV_WEBHOOK: ${{ secrets.SLACK_VAIBHAV_WEBHOOK }}
          SLACK_RAJVEER_WEBHOOK: ${{ secrets.SLACK_RAJVEER_WEBHOOK }}
